<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Judgment fixture labeling</title>
<style>
  :root { color-scheme: light dark; --ok:#137333; --quiet:#8a6d00; --never:#a50e0e; --line:#d0d0d5; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:#fafafa; color:#16161a; }
  @media (prefers-color-scheme: dark){ body{ background:#16161a; color:#eaeaea;} :root{--line:#39393f;} }
  header { position:sticky; top:0; z-index:5; padding:12px 20px; background:inherit;
           border-bottom:1px solid var(--line); display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0; font-weight:600; }
  header .grow { flex:1; }
  .counts { font-variant-numeric:tabular-nums; opacity:.8; }
  .counts b { font-weight:600; }
  button { font:inherit; padding:5px 12px; border:1px solid var(--line); border-radius:7px;
           background:transparent; color:inherit; cursor:pointer; }
  button:hover { border-color:#8a8a90; }
  button.primary { background:#1a73e8; color:#fff; border-color:#1a73e8; }
  main { max-width:860px; margin:0 auto; padding:20px; }
  .card { border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin:0 0 16px;
          background:rgba(127,127,127,.04); scroll-margin-top:76px; }
  .card.focus { outline:2px solid #1a73e8; }
  .card.done { border-color:var(--ok); }
  .title { font-size:17px; font-weight:600; margin:0 0 4px; }
  .meta { font-size:12.5px; opacity:.75; margin-bottom:10px; display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .badge { font-size:11px; padding:2px 7px; border-radius:20px; border:1px solid var(--line); }
  .prior-never{ color:var(--never);} .prior-quiet{ color:var(--quiet);} .prior-surface{ color:var(--ok);}
  .text { white-space:pre-wrap; max-height:220px; overflow:auto; padding:10px 12px; border:1px solid var(--line);
          border-radius:8px; background:rgba(127,127,127,.05); font-size:14px; }
  .controls { display:flex; gap:8px; align-items:center; margin-top:12px; flex-wrap:wrap; }
  .seg button.on-surface{ background:var(--ok); color:#fff; border-color:var(--ok);}
  .seg button.on-quiet{ background:var(--quiet); color:#fff; border-color:var(--quiet);}
  .seg button.on-never{ background:var(--never); color:#fff; border-color:var(--never);}
  label.sp { margin-left:8px; display:inline-flex; gap:6px; align-items:center; cursor:pointer; user-select:none; }
  .hint { font-size:12px; opacity:.6; margin-left:auto; }
  .empty { text-align:center; opacity:.6; padding:40px; }
</style>
</head>
<body>
<header>
  <h1>Judgment fixture labeling</h1>
  <span class="counts" id="counts"></span>
  <span class="grow"></span>
  <button id="filter">Show: all</button>
  <button class="primary" id="save">Save labels.json</button>
</header>
<main id="list"></main>
<script type="application/json" id="labeler-data">__LABELER_DATA__</script>
<script>
"use strict";
const KEY = "cockpit-judgment-labels";
const raw = JSON.parse(document.getElementById("labeler-data").textContent);
const fixtures = raw.fixtures || {};
const state = {};                       // id -> {label, isSubstantivePrimary}
raw.labels.forEach(l => state[l.id] = {
  label: l.label ?? null,
  isSubstantivePrimary: (typeof l.isSubstantivePrimary === "boolean") ? l.isSubstantivePrimary : null,
});
try { const s = JSON.parse(localStorage.getItem(KEY) || "{}");
  for (const id in s) if (state[id]) state[id] = { ...state[id], ...s[id] }; } catch {}

let unlabeledOnly = false;
let focusIdx = 0;
const order = raw.labels.map(l => l.id);

const isDone = id => state[id].label !== null && state[id].isSubstantivePrimary !== null;
const visible = () => order.filter(id => !unlabeledOnly || !isDone(id));

function persist(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} render(); }
function setLabel(id, v){ state[id].label = state[id].label === v ? null : v; persist(); }
function setSP(id, v){ state[id].isSubstantivePrimary = v; persist(); }

function esc(s){ return (s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

function render(){
  const done = order.filter(isDone).length;
  const by = v => order.filter(id => state[id].label === v).length;
  document.getElementById("counts").innerHTML =
    `<b>${done}</b>/${order.length} labeled &nbsp;·&nbsp; surface ${by("surface")} · quiet ${by("quiet")} · never ${by("never")}`;
  document.getElementById("filter").textContent = unlabeledOnly ? "Show: unlabeled" : "Show: all";
  const ids = visible();
  const list = document.getElementById("list");
  if (!ids.length){ list.innerHTML = `<p class="empty">Nothing to show. All labeled 🎉</p>`; return; }
  if (focusIdx >= ids.length) focusIdx = ids.length - 1;
  list.innerHTML = ids.map((id, i) => {
    const f = fixtures[id] || {}; const s = state[id];
    const prior = (raw.labels.find(l => l.id === id) || {}).dispositionPrior || "uncertain";
    const seg = v => `<button class="${s.label===v?"on-"+v:""}" data-act="label" data-id="${id}" data-v="${v}">${v[0].toUpperCase()+v.slice(1)}</button>`;
    return `<article class="card ${i===focusIdx?"focus":""} ${isDone(id)?"done":""}" data-idx="${i}" id="c-${id}">
      <p class="title">${esc(f.title) || "(untitled)"}</p>
      <div class="meta"><span>${esc(f.publisher)||"?"}</span><span class="badge">${esc(f.kind)||"?"}</span>
        <span>${esc((f.publishedAt||"").slice(0,10))}</span>
        <span class="badge prior-${prior}">gmail prior: ${prior}</span></div>
      <div class="text">${esc(f.text) || "(no text captured)"}</div>
      <div class="controls">
        <span class="seg">${seg("surface")} ${seg("quiet")} ${seg("never")}</span>
        <label class="sp"><input type="checkbox" data-act="sp" data-id="${id}" ${s.isSubstantivePrimary?"checked":""}> substantive primary</label>
        <span class="hint">keys: S/Q/N · P · J/K</span>
      </div></article>`;
  }).join("");
}

document.getElementById("list").addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  if (el.dataset.act === "label") setLabel(el.dataset.id, el.dataset.v);
  else if (el.dataset.act === "sp") setSP(el.dataset.id, el.checked);
  const card = e.target.closest(".card"); if (card) focusIdx = +card.dataset.idx;
});

document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.metaKey || e.ctrlKey) return;
  const ids = visible(); if (!ids.length) return;
  const id = ids[Math.min(focusIdx, ids.length-1)];
  const k = e.key.toLowerCase();
  if (k === "j" || k === "arrowdown"){ focusIdx = Math.min(focusIdx+1, ids.length-1); render(); scrollFocus(); e.preventDefault(); }
  else if (k === "k" || k === "arrowup"){ focusIdx = Math.max(focusIdx-1, 0); render(); scrollFocus(); e.preventDefault(); }
  else if (k === "s") setLabel(id, "surface");
  else if (k === "q") setLabel(id, "quiet");
  else if (k === "n") setLabel(id, "never");
  else if (k === "p") setSP(id, !state[id].isSubstantivePrimary);
});
function scrollFocus(){ const c = document.querySelector(".card.focus"); if (c) c.scrollIntoView({block:"nearest"}); }

document.getElementById("filter").onclick = () => { unlabeledOnly = !unlabeledOnly; focusIdx = 0; render(); };

document.getElementById("save").onclick = async () => {
  const labels = raw.labels.map(l => ({ ...l, label: state[l.id].label, isSubstantivePrimary: state[l.id].isSubstantivePrimary }))
    .sort((a,b) => a.id < b.id ? -1 : a.id > b.id ? 1 : 0);
  const json = JSON.stringify({ labels }, null, 2) + "\n";
  if (window.showSaveFilePicker){
    try { const h = await showSaveFilePicker({ suggestedName:"labels.json",
            types:[{description:"JSON",accept:{"application/json":[".json"]}}] });
      const w = await h.createWritable(); await w.write(json); await w.close();
      alert("Saved."); return; } catch(err){ if (err.name === "AbortError") return; }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([json], {type:"application/json"}));
  a.download = "labels.json"; a.click(); URL.revokeObjectURL(a.href);
};

render();
</script>
</body>
</html>
