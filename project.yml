name: Cockpit
options:
  bundleIdPrefix: com.jonphillips
  deploymentTarget:
    iOS: "27.0"
  xcodeVersion: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: 7MQEE539G9
    CODE_SIGN_STYLE: Automatic
packages:
  CockpitCore:
    path: CockpitCore
  CloudSyncKit:
    path: ../jon-platform/packages/CloudSyncKit
  SQLiteData:
    url: https://github.com/pointfreeco/sqlite-data
    from: 1.8.0
  Dependencies:
    url: https://github.com/pointfreeco/swift-dependencies
    from: 1.0.0
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.6.0
  StructuredQueries:
    url: https://github.com/pointfreeco/swift-structured-queries
    from: 0.31.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 9.0.0
targets:
  Cockpit:
    type: application
    platform: iOS
    sources:
      - CockpitApp
    entitlements:
      path: CockpitApp/Cockpit.entitlements
      properties:
        aps-environment: development
        com.apple.developer.icloud-container-identifiers: [iCloud.com.jonphillips.cockpit]
        com.apple.developer.icloud-services: [CloudKit]
    info:
      path: CockpitApp/Info.plist
      properties:
        CFBundleDisplayName: Cockpit
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - com.googleusercontent.apps.305782585157-80plee5p6augqkg5l5ps60bft7fe8r29
        GIDClientID: 305782585157-80plee5p6augqkg5l5ps60bft7fe8r29.apps.googleusercontent.com
        UILaunchScreen: {}
    dependencies:
      - package: CockpitCore
        product: CockpitCore
      - package: CloudSyncKit
        product: CloudSyncKit
      - package: SQLiteData
        product: SQLiteData
      - package: Dependencies
        product: Dependencies
      - package: GRDB
        product: GRDB
      - package: StructuredQueries
        product: StructuredQueriesCore
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonphillips.cockpit
        CODE_SIGN_ENTITLEMENTS: CockpitApp/Cockpit.entitlements
        TARGETED_DEVICE_FAMILY: "2"
schemes:
  Cockpit:
    build:
      targets:
        Cockpit: all
    run:
      config: Debug
